name: Deploy VPS

on:
  push:
    branches: [master, test]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Publish
        run: dotnet publish Sunduk.PWA/Sunduk.PWA.csproj -c Release --output release --nologo

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy master → www.sunduk.one
        if: github.ref == 'refs/heads/master'
        run: rsync -avz --delete release/wwwroot/ root@${{ secrets.VPS_HOST }}:/var/www/www.sunduk.one/html/

      - name: Deploy test → test.sunduk.one
        if: github.ref == 'refs/heads/test'
        run: rsync -avz --delete release/wwwroot/ root@${{ secrets.VPS_HOST }}:/var/www/test.sunduk.one/html/
