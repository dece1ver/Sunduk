name: Deploy VPS

on:
  push:
    branches: [master, test]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Publish
        run: dotnet publish Sunduk.PWA/Sunduk.PWA.csproj -c Release --output release --nologo

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Deploy master → www.sunduk.one
        if: github.ref == 'refs/heads/master'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: release/wwwroot/
          remote_path: /var/www/www.sunduk.one/html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy test → test.sunduk.one
        if: github.ref == 'refs/heads/test'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: release/wwwroot/
          remote_path: /var/www/test.sunduk.one/html/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: root
          remote_key: ${{ secrets.VPS_SSH_KEY }}
